<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #Box{
            display: flex;
            border:2px solid black;
            height: 200px;
            width:400px;
            flex-direction: column;
            justify-content: center;
            align-items:center;
            gap:10px;
            opacity: 0.8;
            border-radius:10px;
            background-color: grey;
            color:black;
        }
        Body{
            display: flex;
            justify-content: center;
            align-items:center ;
            height: 100vh;
            background-color: rgb(252, 252, 252);
        }
        #temp input {
            height:25px;
            border-radius:10px;
            border:none;
            padding:5px;
        }
        #converted{
            height:30px;
            width:100px;
        }
    </style>

    <div id="Box">
        TEMP CONVERTER
        <div id="temp">
            <input id="input" type="text" placeholder="Input Temp" name="reset"> =
            <input id="output" type="text" placeholder="Result" name="reset" readonly>
        </div>
        <div>
            <label>
                <input type="radio" name="unit" value="c" >
                Celsius
            </label>
            <label>
                <input type="radio" name="unit" value="f">
                Fahrenheit
            </label>
        </div>
        <div id="convert">
            <input type="reset" name="reset">
            <button id="converted" onclick="Solve()">Convert</button>
        </div>
    </div>


    <script src="TempConverter.js"></script>
</body>
</html>
